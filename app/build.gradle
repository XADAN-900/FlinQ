plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xadan.flinq'
    compileSdk 34

    defaultConfig {
        applicationId "com.xadan.flinq"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    // Sabit imza: GitHub Secrets'ta anahtar varsa her sürüm aynı anahtarla imzalanır, böylece
    // yeni APK eskisinin üzerine (verileri silmeden) güncelleme olarak kurulur.
    def ksFile = System.getenv("FQ_KEYSTORE_FILE")
    signingConfigs {
        if (ksFile != null && file(ksFile).exists()) {
            flinq {
                storeFile file(ksFile)
                storePassword System.getenv("FQ_KEYSTORE_PASSWORD")
                keyAlias System.getenv("FQ_KEY_ALIAS") ?: "flinq"
                keyPassword System.getenv("FQ_KEY_PASSWORD") ?: System.getenv("FQ_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile != null && file(ksFile).exists()) {
                signingConfig signingConfigs.flinq
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'
}

// FCM için app/google-services.json gerekir (Firebase konsolundan indirilir).
// Dosya yoksa uygulama yine derlenir; sadece push devre dışı kalır.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
