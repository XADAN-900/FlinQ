<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FlinQ</title>
<style>
  html,body{margin:0;height:100%;background:#0A0C10;color:#e4e6eb;font-family:system-ui,sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  img{width:96px;height:96px;margin-bottom:24px}
  h1{font-size:22px;margin:0 0 8px}
  p{margin:0 0 28px;color:#b0b3b8;font-size:15px;line-height:1.5;max-width:320px}
  button{background:#FF5A5F;color:#fff;border:0;border-radius:14px;padding:14px 32px;font-size:16px;font-weight:600}
  button:active{opacity:.8}
  button:disabled{opacity:.6}
</style>
</head>
<body>
<div class="wrap">
  <img src="flinq_logo.png" alt="">
  <h1>İnternet bağlantısı yok</h1>
  <p>FlinQ'u kullanmak için internete bağlanman gerekiyor. Bağlantı gelince uygulama otomatik açılacak.</p>
  <button onclick="var b=this;b.disabled=true;b.textContent='Kontrol ediliyor...';setTimeout(function(){b.disabled=false;b.textContent='Tekrar dene'},4000);if(window.FlinqAndroid){FlinqAndroid.retry()}else{location.reload()}">Tekrar dene</button>
</div>
</body>
</html>
